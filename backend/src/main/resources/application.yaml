server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: billings
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

security:
  jwt:
    secret: "mySecretKeyForJWT256BitsMustBeLongEnoughForHS512"
    accessExpiration: 1800000 # 30 minuti in millisecondi
    refreshExpiration: 86400000 # 1 giorno in millisecondi